apiVersion: batch/v1
kind: Job
metadata:
  name: gas-migrate-${JOB_SUFFIX}
  namespace: gas
  labels:
    app.kubernetes.io/name: gas-migrate
    app.kubernetes.io/part-of: ghana-audit-service
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gas-migrate
        app.kubernetes.io/part-of: ghana-audit-service
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # ACR_REGISTRY and IMAGE_TAG are substituted by envsubst in the deploy
          # workflow's "Run migration Job" step (from the workflow `env` block) —
          # single source of truth, so this always matches what build-and-push
          # pushed. For manual deploys, export both first (see k8s/README.md).
          image: ${ACR_REGISTRY}.azurecr.io/gas-migrate:${IMAGE_TAG}
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: gas-config
            - secretRef:
                name: gas-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
