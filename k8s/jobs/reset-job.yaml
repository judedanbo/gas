# =============================================================================
# DESTRUCTIVE — DATABASE RESET JOB (TEST / STAGING ONLY)
# =============================================================================
# This Job DROPS the entire `ghana_audit_service` database, recreates it, and
# re-runs migrations. ALL DATA IS LOST. It is intended ONLY for the non-prod
# (test/staging) cluster. NEVER point it at a production database.
#
# It is intentionally NOT applied by the deploy workflow (.github/workflows/
# deploy.yml) — it must be run by hand, and it is created SUSPENDED so applying
# it does nothing until you explicitly fire it.
#
# Prerequisite: the migrator image must have been rebuilt and pushed AFTER
# `server/database/reset.ts` was added to the Dockerfile migrator stage.
#
# Usage:
#   1. Create it (suspended — nothing runs yet). Export the same image vars
#      deploy.yml uses, then envsubst (the image is templated):
#        export ACR_REGISTRY=<ACR_NAME> IMAGE_TAG=<TAG>
#        envsubst < k8s/jobs/reset-job.yaml | kubectl apply -f -
#   2. Fire it:
#        kubectl patch job gas-reset-job -n gas --type=merge \
#          -p '{"spec":{"suspend":false}}'
#   3. Watch:
#        kubectl logs -n gas job/gas-reset-job -f
#   4. Re-run later (Jobs are immutable — delete first):
#        kubectl delete job gas-reset-job -n gas
#        envsubst < k8s/jobs/reset-job.yaml | kubectl apply -f -   # then patch to fire again
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: gas-reset-job
  namespace: gas
  labels:
    app.kubernetes.io/name: gas-reset
    app.kubernetes.io/part-of: ghana-audit-service
spec:
  # Created suspended: applying this file does NOT run the reset. Fire it
  # explicitly by patching spec.suspend to false (see usage above).
  suspend: true
  # Never auto-retry a destructive operation.
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gas-reset
        app.kubernetes.io/part-of: ghana-audit-service
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reset
          # Same migrator image as gas-migrate-job (must include reset.ts).
          # ACR_REGISTRY and IMAGE_TAG are substituted by envsubst (see Usage) —
          # so this always matches what build-and-push pushed.
          image: ${ACR_REGISTRY}.azurecr.io/gas-migrate:${IMAGE_TAG}
          imagePullPolicy: Always
          # Override the image's default migrate command with the reset script.
          command: ["npx", "tsx", "server/database/reset.ts"]
          envFrom:
            - configMapRef:
                name: gas-config
            - secretRef:
                name: gas-secrets
          env:
            # These override the values from gas-config/gas-secrets above
            # (an explicit `env` entry beats `envFrom`):
            #  - DB_RESET_ALLOW / DB_RESET_ALLOW_REMOTE: deliberate opt-in to the
            #    remote-database reset that reset.ts refuses by default.
            #  - NODE_ENV: gas-config sets "production"; reset.ts refuses under
            #    production, so override it here (this cluster is test/staging).
            - name: DB_RESET_ALLOW
              value: "yes"
            - name: DB_RESET_ALLOW_REMOTE
              value: "yes"
            - name: NODE_ENV
              value: "staging"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
