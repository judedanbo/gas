apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: gas
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: ghana-audit-service
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: gas
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: ghana-audit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: ghana-audit-service
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
            - --requirepass
            - $(REDIS_PASSWORD)
            # TLS-only: disable the plaintext port and serve TLS on 6379. Clients
            # authenticate with the password + verify the server cert; client
            # certs are not required (--tls-auth-clients no).
            - --port
            - "0"
            - --tls-port
            - "6379"
            - --tls-cert-file
            - /tls/tls.crt
            - --tls-key-file
            - /tls/tls.key
            - --tls-ca-cert-file
            - /tls/ca.crt
            - --tls-auth-clients
            - "no"
          env:
            # Password for --requirepass above (k8s expands $(REDIS_PASSWORD) from env).
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gas-secrets
                  key: REDIS_PASSWORD
            # redis-cli reads REDISCLI_AUTH automatically, so the health probes
            # below authenticate without putting the password on the command line.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: gas-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 256Mi
          # Probes connect over TLS to localhost. --insecure skips verification
          # for this in-pod check only (the cert SANs are the Service names, not
          # localhost); REDISCLI_AUTH supplies the password. The real client
          # (frontend) verifies the server cert against the CA.
          readinessProbe:
            exec:
              command: ["redis-cli", "--tls", "--insecure", "-p", "6379", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "--tls", "--insecure", "-p", "6379", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-tls
              mountPath: /tls
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
        - name: redis-tls
          secret:
            secretName: redis-tls
