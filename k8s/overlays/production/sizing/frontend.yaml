# TODO(sizing): values below equal the base (measured for A-G report PDF
# optimisation running inside the pod: ~2 cores busy while OCRing, ~330 MiB
# peak; see k8s/README.md "Frontend probes"). Revisit with production traffic:
#   - requests.cpu drives the HPA's 70% target — too low and it flaps.
#   - raise PDF_OPTIMIZATION_MAX_CONCURRENT (gas-config) only together with
#     these limits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gas-frontend
  namespace: gas # base namespace; the overlay's `namespace:` renames it
spec:
  template:
    spec:
      containers:
        - name: frontend
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
