apiVersion: v1
kind: Secret
metadata:
  name: gas-secrets
  namespace: gas
  labels:
    app.kubernetes.io/part-of: ghana-audit-service
type: Opaque
stringData:
  DB_USER: "${DB_USER}"
  DB_PASSWORD: "${DB_PASSWORD}"
  JWT_SECRET: "${JWT_SECRET}"
  NUXT_API_SECRET: "${NUXT_API_SECRET}"
  ANALYTICS_IP_SALT: "${ANALYTICS_IP_SALT}"
  # Redis authentication. REDIS_PASSWORD is consumed by the redis Deployment
  # (--requirepass) and the frontend reaches Redis via the authenticated
  # REDIS_URL below. If the REDIS_PASSWORD GitHub Actions secret is unset,
  # envsubst renders these empty and Redis starts without auth (degrades to the
  # previous behaviour rather than failing) — set the secret to enable auth.
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  # rediss:// — TLS to Redis. The frontend verifies the server against the CA
  # mounted from the redis-tls secret (REDIS_CA_FILE). See k8s/redis/tls.yaml.
  REDIS_URL: "rediss://:${REDIS_PASSWORD}@redis.gas.svc.cluster.local:6379/0"
  # Azure Blob backend for report PDFs (server/utils/blobStorage.ts). When the
  # matching GitHub Actions secrets are unset, envsubst renders these empty and
  # the app falls back to on-disk public/pdf — the feature stays off until both
  # are provided. See k8s/README.md "Report PDFs — Azure Blob Storage".
  AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING}"
  AZURE_BLOB_CONTAINER: "${AZURE_BLOB_CONTAINER}"
  # Consumed by server/database/seed.ts (admin user), run via k8s/jobs/seed-job.yaml.
  # The matching ADMIN_EMAIL / ADMIN_PASSWORD / ADMIN_NAME GitHub Actions repo
  # secrets must exist, or envsubst renders these empty and the seed exits 1.
  ADMIN_EMAIL: "${ADMIN_EMAIL}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
  ADMIN_NAME: "${ADMIN_NAME}"
  # SMTP for transactional email (server/utils/email.ts): admin invitations +
  # contact-form notifications. If the GitHub Actions secrets are unset, envsubst
  # renders these empty and getTransporter() returns null — email silently no-ops
  # (a startup warning is logged by server/plugins/validateConfig.ts). Use port
  # 465 for implicit TLS or 587 for STARTTLS (see email.ts `secure` logic).
  NUXT_SMTP_HOST: "${NUXT_SMTP_HOST}"
  NUXT_SMTP_PORT: "${NUXT_SMTP_PORT}"
  NUXT_SMTP_USER: "${NUXT_SMTP_USER}"
  NUXT_SMTP_PASS: "${NUXT_SMTP_PASS}"
  NUXT_SMTP_FROM: "${NUXT_SMTP_FROM}"
---
apiVersion: v1
kind: Secret
metadata:
  name: gas-db-credentials
  namespace: gas
  labels:
    app.kubernetes.io/part-of: ghana-audit-service
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
  MYSQL_USER: "${DB_USER}"
  MYSQL_PASSWORD: "${DB_PASSWORD}"
  MYSQL_DATABASE: "ghana_audit_service"
---
apiVersion: v1
kind: Secret
metadata:
  name: azure-storage-secret
  namespace: gas
  labels:
    app.kubernetes.io/part-of: ghana-audit-service
type: Opaque
stringData:
  # Exact keys required by the Azure File CSI driver (nodeStageSecretRef).
  azurestorageaccountname: "${AZURE_STORAGE_ACCOUNT_NAME}"
  azurestorageaccountkey: "${AZURE_STORAGE_ACCOUNT_KEY}"
