apiVersion: apps/v1
kind: Deployment
metadata:
  name: gas-frontend
  namespace: gas
  labels:
    app.kubernetes.io/name: gas-frontend
    app.kubernetes.io/part-of: ghana-audit-service
  annotations:
    # Auto-restart this Deployment when gas-config / gas-secrets change. Without
    # this, a config-only change (e.g. NUXT_SMTP_FROM) re-renders the Secret but
    # leaves the pod template byte-identical, so pods keep stale env until a
    # manual `kubectl rollout restart`. Requires the Reloader controller to be
    # installed in the cluster (see k8s/README.md); a no-op otherwise.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gas-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gas-frontend
        app.kubernetes.io/part-of: ghana-audit-service
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-public
          image: ${ACR_REGISTRY}.azurecr.io/gas-frontend:${IMAGE_TAG}
          command:
            - sh
            - -c
            - |
              # busybox `cp -rn /src/. /dst/` is broken (copies nothing); use
              # find + per-file no-clobber. Verified in node:24-alpine.
              # pdf is runtime-write-only (no baked content), so it is not seeded.
              #
              # Failures are fatal on purpose. This used to run inside
              # `( cd ... 2>/dev/null && ... )`, which swallowed every error: a
              # copy that failed — e.g. the blobfuse share mounting with
              # ownership this uid-1001 process cannot write to, since the
              # dynamic my-blobstorage PVC sets no uid/gid mountOptions — left
              # the pod Running against a half-populated share, so baked assets
              # 404ed with nothing in the logs. Crash instead, visibly.
              set -e
              for d in img images uploads; do
                src="/app/.output/public/$d"
                if [ ! -d "$src" ]; then
                  echo "seed-public: $src missing from the image" >&2
                  exit 1
                fi
                cd "$src"
                # Explicit if/fi, not `[ -e ... ] ||` — under `set -e` a false
                # test as the last command in the loop body would abort the run.
                find . -type f | while IFS= read -r f; do
                  if [ ! -e "/seed/$d/$f" ]; then
                    mkdir -p "/seed/$d/$(dirname "$f")"
                    cp "$src/$f" "/seed/$d/$f"
                  fi
                done
                echo "seed-public: $d -> $(find "/seed/$d" -type f | wc -l) file(s) on the share"
              done
          volumeMounts:
            - { name: public-files, mountPath: /seed/img, subPath: img }
            - { name: public-files, mountPath: /seed/images, subPath: images }
            - { name: public-files, mountPath: /seed/uploads, subPath: uploads }
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: frontend
          image: ${ACR_REGISTRY}.azurecr.io/gas-frontend:${IMAGE_TAG}
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: gas-config
            - secretRef:
                name: gas-secrets
          env:
            # CA used to verify the Redis server when REDIS_URL is rediss://.
            # The volume is optional (below), so a missing redis-tls secret
            # leaves this path absent; the client tolerates that and falls back.
            - name: REDIS_CA_FILE
              value: /tls/redis-ca.crt
          volumeMounts:
            - name: redis-ca
              mountPath: /tls
              readOnly: true
            - { name: public-files, mountPath: /app/public/img, subPath: img }
            - {
                name: public-files,
                mountPath: /app/.output/public/img,
                subPath: img,
              }
            - {
                name: public-files,
                mountPath: /app/public/images,
                subPath: images,
              }
            - {
                name: public-files,
                mountPath: /app/.output/public/images,
                subPath: images,
              }
            - {
                name: public-files,
                mountPath: /app/public/uploads,
                subPath: uploads,
              }
            - {
                name: public-files,
                mountPath: /app/.output/public/uploads,
                subPath: uploads,
              }
            - { name: public-files, mountPath: /app/public/pdf, subPath: pdf }
            - {
                name: public-files,
                mountPath: /app/.output/public/pdf,
                subPath: pdf,
              }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: public-files
          persistentVolumeClaim:
            claimName: gas-public-files-pvc
        # CA for verifying Redis TLS. optional:true so the frontend still starts
        # if the redis-tls secret hasn't been provisioned yet (no site outage).
        - name: redis-ca
          secret:
            secretName: redis-tls
            optional: true
            items:
              - key: ca.crt
                path: redis-ca.crt
