apiVersion: apps/v1
kind: Deployment
metadata:
  name: gas-frontend
  namespace: gas
  labels:
    app.kubernetes.io/name: gas-frontend
    app.kubernetes.io/part-of: ghana-audit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gas-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gas-frontend
        app.kubernetes.io/part-of: ghana-audit-service
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-public
          image: regisry.azurecr.io/gas-frontend:latest
          command:
            - sh
            - -c
            - |
              # busybox `cp -rn /src/. /dst/` is broken (copies nothing); use
              # find + per-file no-clobber. Verified in node:24-alpine.
              # pdf is runtime-write-only (no baked content), so it is not seeded.
              for d in img images uploads; do
                ( cd /app/.output/public/$d 2>/dev/null && find . -type f | while IFS= read -r f; do
                    [ -e "/seed/$d/$f" ] || { mkdir -p "/seed/$d/$(dirname "$f")"; cp "/app/.output/public/$d/$f" "/seed/$d/$f"; }
                  done )
              done
          volumeMounts:
            - { name: public-files, mountPath: /seed/img, subPath: img }
            - { name: public-files, mountPath: /seed/images, subPath: images }
            - { name: public-files, mountPath: /seed/uploads, subPath: uploads }
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: frontend
          image: regisry.azurecr.io/gas-frontend:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: gas-config
            - secretRef:
                name: gas-secrets
          volumeMounts:
            - { name: public-files, mountPath: /app/public/img, subPath: img }
            - {
                name: public-files,
                mountPath: /app/.output/public/img,
                subPath: img,
              }
            - {
                name: public-files,
                mountPath: /app/public/images,
                subPath: images,
              }
            - {
                name: public-files,
                mountPath: /app/.output/public/images,
                subPath: images,
              }
            - {
                name: public-files,
                mountPath: /app/public/uploads,
                subPath: uploads,
              }
            - {
                name: public-files,
                mountPath: /app/.output/public/uploads,
                subPath: uploads,
              }
            - { name: public-files, mountPath: /app/public/pdf, subPath: pdf }
            - {
                name: public-files,
                mountPath: /app/.output/public/pdf,
                subPath: pdf,
              }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: public-files
          persistentVolumeClaim:
            claimName: gas-public-files-pvc
