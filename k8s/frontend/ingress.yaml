apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gas-frontend
  namespace: gas
  labels:
    app.kubernetes.io/name: gas-frontend
    app.kubernetes.io/part-of: ghana-audit-service
  annotations:
    cert-manager.io/cluster-issuer: infosys-issuer
    # Must cover the largest app-side upload limit (report PDFs: 100MB in
    # server/utils/fileUpload.ts) plus multipart overhead, so oversize files
    # get the app's friendly validation error instead of a raw nginx 413.
    nginx.ingress.kubernetes.io/proxy-body-size: "105m"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - test.audit.gov.gh
      secretName: gas-tls
  rules:
    - host: test.audit.gov.gh
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gas-frontend
                port:
                  number: 80
