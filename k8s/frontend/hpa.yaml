apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gas-frontend
  namespace: gas
  labels:
    app.kubernetes.io/name: gas-frontend
    app.kubernetes.io/part-of: ghana-audit-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gas-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
