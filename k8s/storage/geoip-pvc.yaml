# MaxMind GeoLite2 databases for visitor geolocation
# (server/utils/analytics/geoip.ts). Written by the geoip-update CronJob
# (k8s/jobs/geoip-update-cronjob.yaml) and mounted read-only into the frontend,
# which reloads changed files on its own — no restart needed.
#
# ReadWriteMany because the frontend runs several replicas (HPA) on different
# nodes while the CronJob writes. azurefile-csi ships with every AKS cluster,
# binds immediately, and its default mount options (dir_mode/file_mode 0777)
# let the uid-1001 pods read and write. The files total ~20 MB.
#
# Applied create-if-absent by the deploy workflow (a Bound PVC's spec is
# immutable), and lives across deploys.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gas-geoip-pvc
  namespace: gas
  labels:
    app.kubernetes.io/name: gas-geoip
    app.kubernetes.io/part-of: ghana-audit-service
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: azurefile-csi
  resources:
    requests:
      storage: 1Gi
