# Ephemeral debug pod for inspecting the contents of gas-public-files-pvc
# (the Azure Blob NFS share backing public/{img,images,uploads,pdf}).
#
# NOT part of the deploy workflow — apply/delete manually:
#   kubectl apply -f k8s/storage/debug-pvc-inspector.yaml
#   kubectl exec -it -n gas pvc-inspector -- sh
#   # inside: ls -la /pvc  ;  du -sh /pvc/*  ;  find /pvc -type f | head
#   kubectl delete -f k8s/storage/debug-pvc-inspector.yaml   # clean up when done
#
# The PVC is mounted read-only at /pvc with no subPath, so you see the whole
# share (img/ images/ uploads/ pdf/) at once. RWX means this runs alongside
# the live frontend without contention.
apiVersion: v1
kind: Pod
metadata:
  name: pvc-inspector
  namespace: gas
  labels:
    app.kubernetes.io/name: pvc-inspector
    app.kubernetes.io/part-of: ghana-audit-service
spec:
  # Restart never: this is a one-shot debug box, not a workload.
  restartPolicy: Never
  # Satisfies the namespace's restricted Pod Security Standard.
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: inspector
      image: busybox:1.36
      # Idle so you can exec in; auto-exits after 1h as a safety net.
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: public-files
          mountPath: /pvc
          readOnly: true
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
  volumes:
    - name: public-files
      persistentVolumeClaim:
        claimName: gas-public-files-pvc
        readOnly: true
