# Ephemeral WRITABLE pod for loading local files into gas-public-files-pvc.
# Mounts ONLY the `pdf` subPath (read-write) to limit blast radius to that dir.
# Runs as uid/gid 1001 so copied files inherit ownership the frontend can read.
#
# NOT part of the deploy workflow. Use with kubectl cp, then delete:
#   kubectl apply -f k8s/storage/debug-pvc-writer.yaml
#   kubectl cp <local> gas/pvc-writer:/data/<dest>
#   kubectl delete -f k8s/storage/debug-pvc-writer.yaml
apiVersion: v1
kind: Pod
metadata:
  name: pvc-writer
  namespace: gas
  labels:
    app.kubernetes.io/name: pvc-writer
    app.kubernetes.io/part-of: ghana-audit-service
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "sleep 7200"]
      volumeMounts:
        - name: public-files
          mountPath: /data
          subPath: pdf
        - name: tmp
          mountPath: /tmp
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
  volumes:
    - name: public-files
      persistentVolumeClaim:
        claimName: gas-public-files-pvc
    - name: tmp
      emptyDir: {}
