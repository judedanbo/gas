# Database migration Job — runs `npm run db:apply` against MySQL.
#
# Build the image from the `migrator` stage of ghana-audit-service/Dockerfile:
#   docker build --target migrator \
#     -t registry.example.com/gas-migrate:<tag> \
#     ./ghana-audit-service
#
# Apply this Job before rolling new app pods. With Helm, convert the
# annotations below to "helm.sh/hook: pre-upgrade,pre-install". With Argo CD,
# use "argocd.argoproj.io/hook: PreSync".
#
# The Job is idempotent: drizzle-orm tracks applied migrations in a
# `__drizzle_migrations` table, so re-running is a no-op.
---
apiVersion: v1
kind: Secret
metadata:
  name: gas-db-credentials
  namespace: gas
type: Opaque
stringData:
  # Replace with your actual values, or manage via SealedSecrets / ExternalSecrets.
  DB_USER: gas_user
  DB_PASSWORD: change-me
---
apiVersion: batch/v1
kind: Job
metadata:
  # Helm: use {{ .Release.Revision }} so each upgrade gets a unique Job name.
  name: gas-migrate
  namespace: gas
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: gas
        component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: registry.example.com/gas-migrate:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: gas-db-credentials
          env:
            - name: DB_HOST
              value: mysql.gas.svc.cluster.local
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: ghana_audit_service
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
