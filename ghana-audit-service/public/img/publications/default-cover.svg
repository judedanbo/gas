<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#004d2e"/>
      <stop offset="100%" stop-color="#006B3F"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <polygon points="560,0 800,0 800,180" fill="#CE1126" opacity="0.15"/>
  <polygon points="0,420 0,600 240,600" fill="#FCD116" opacity="0.12"/>

  <rect x="0" y="0" width="800" height="4" fill="#FCD116"/>

  <!-- Open book icon -->
  <g transform="translate(400, 218)" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spine -->
    <line x1="0" y1="-56" x2="0" y2="56" stroke="rgba(255,255,255,0.5)"/>
    <!-- Left page -->
    <path d="M 0,-56 C -16,-52 -48,-50 -56,-48 L -56,48 C -48,46 -16,44 0,48" fill="rgba(255,255,255,0.06)"/>
    <path d="M 0,-56 C -16,-52 -48,-50 -56,-48 L -56,48 C -48,46 -16,44 0,48" stroke="rgba(255,255,255,0.7)"/>
    <!-- Right page -->
    <path d="M 0,-56 C 16,-52 48,-50 56,-48 L 56,48 C 48,46 16,44 0,48" fill="rgba(255,255,255,0.06)"/>
    <path d="M 0,-56 C 16,-52 48,-50 56,-48 L 56,48 C 48,46 16,44 0,48" stroke="rgba(255,255,255,0.7)"/>
    <!-- Left page lines -->
    <line x1="-42" y1="-30" x2="-10" y2="-32" stroke="rgba(255,255,255,0.25)"/>
    <line x1="-44" y1="-16" x2="-10" y2="-18" stroke="rgba(255,255,255,0.25)"/>
    <line x1="-46" y1="-2" x2="-10" y2="-4" stroke="rgba(255,255,255,0.25)"/>
    <line x1="-46" y1="12" x2="-18" y2="10" stroke="rgba(255,255,255,0.2)"/>
    <!-- Right page lines -->
    <line x1="10" y1="-32" x2="42" y2="-30" stroke="rgba(255,255,255,0.25)"/>
    <line x1="10" y1="-18" x2="44" y2="-16" stroke="rgba(255,255,255,0.25)"/>
    <line x1="10" y1="-4" x2="46" y2="-2" stroke="rgba(255,255,255,0.25)"/>
    <line x1="10" y1="10" x2="36" y2="12" stroke="rgba(255,255,255,0.2)"/>
  </g>

  <text x="400" y="370" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="3">
    GHANA AUDIT SERVICE
  </text>

  <text x="400" y="400" text-anchor="middle" fill="#FCD116" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" letter-spacing="1.5" opacity="0.9">
    PUBLICATION
  </text>

  <line x1="320" y1="430" x2="480" y2="430" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <text x="400" y="458" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui, -apple-system, sans-serif" font-size="11" letter-spacing="1">
    GOOD GOVERNANCE &amp; ACCOUNTABILITY
  </text>
</svg>
