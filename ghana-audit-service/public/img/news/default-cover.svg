<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#004d2e"/>
      <stop offset="100%" stop-color="#006B3F"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <polygon points="560,0 800,0 800,180" fill="#CE1126" opacity="0.15"/>
  <polygon points="0,420 0,600 240,600" fill="#FCD116" opacity="0.12"/>

  <rect x="0" y="0" width="800" height="4" fill="#FCD116"/>

  <!-- Newspaper icon -->
  <g transform="translate(400, 220)" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Paper body -->
    <rect x="-52" y="-60" width="104" height="120" rx="6" fill="rgba(255,255,255,0.08)"/>
    <!-- Headline bar -->
    <rect x="-38" y="-44" width="76" height="10" rx="2" fill="rgba(255,255,255,0.15)"/>
    <!-- Subheadline -->
    <line x1="-38" y1="-24" x2="38" y2="-24" stroke="rgba(255,255,255,0.3)"/>
    <!-- Image placeholder -->
    <rect x="-38" y="-14" width="34" height="28" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.3)"/>
    <!-- Text lines next to image -->
    <line x1="4" y1="-8" x2="38" y2="-8" stroke="rgba(255,255,255,0.3)"/>
    <line x1="4" y1="2" x2="38" y2="2" stroke="rgba(255,255,255,0.3)"/>
    <line x1="4" y1="12" x2="28" y2="12" stroke="rgba(255,255,255,0.3)"/>
    <!-- Bottom text lines -->
    <line x1="-38" y1="26" x2="38" y2="26" stroke="rgba(255,255,255,0.25)"/>
    <line x1="-38" y1="36" x2="38" y2="36" stroke="rgba(255,255,255,0.25)"/>
    <line x1="-38" y1="46" x2="20" y2="46" stroke="rgba(255,255,255,0.25)"/>
  </g>

  <text x="400" y="370" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="3">
    GHANA AUDIT SERVICE
  </text>

  <text x="400" y="400" text-anchor="middle" fill="#FCD116" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" letter-spacing="1.5" opacity="0.9">
    NEWS &amp; UPDATES
  </text>

  <line x1="320" y1="430" x2="480" y2="430" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <text x="400" y="458" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui, -apple-system, sans-serif" font-size="11" letter-spacing="1">
    GOOD GOVERNANCE &amp; ACCOUNTABILITY
  </text>
</svg>
