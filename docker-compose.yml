services:
  # ===========================================
  # Ghana Audit Service Frontend (Nuxt 3)
  # ===========================================
  frontend:
    build:
      context: ./ghana-audit-service
      dockerfile: Dockerfile
      args:
        - NUXT_PUBLIC_SITE_URL=${NUXT_PUBLIC_SITE_URL:-https://audit.gov.gh}
    container_name: gas-frontend
    restart: unless-stopped
    ports:
      - "3300:3000"
    environment:
      # NOTE: the `:-` fallbacks below are INSECURE local-dev defaults. Provide a
      # populated .env (see .env.example) for any non-local use — secrets left at
      # these values are flagged at startup by server/plugins/validateConfig.ts.
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      # Database connection
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-gas_user}
      - DB_PASSWORD=${DB_PASSWORD:-gas_password}
      - DB_NAME=${DB_NAME:-ghana_audit_service}
      # Application settings
      - NUXT_PUBLIC_SITE_URL=${NUXT_PUBLIC_SITE_URL:-https://audit.gov.gh}
      - NUXT_PUBLIC_SITE_NAME=${NUXT_PUBLIC_SITE_NAME:-Ghana Audit Service}
      - NUXT_PUBLIC_CONTACT_EMAIL=${NUXT_PUBLIC_CONTACT_EMAIL:-info@audit.gov.gh}
      - NUXT_PUBLIC_CONTACT_PHONE=${NUXT_PUBLIC_CONTACT_PHONE:-+233 (302) 664929}
      - NUXT_API_SECRET=${NUXT_API_SECRET:-change-me-in-production}
      # JWT
      - JWT_SECRET=${JWT_SECRET:-change-this-jwt-secret}
      # Admin session expiry (durations accept ms/s/m/h/d suffixes)
      - SESSION_IDLE_TIMEOUT=${SESSION_IDLE_TIMEOUT:-30m}
      - SESSION_ABSOLUTE_TIMEOUT=${SESSION_ABSOLUTE_TIMEOUT:-8h}
      - SESSION_WARNING_BEFORE=${SESSION_WARNING_BEFORE:-2m}
      # Redis (rate limiter / analytics hot counters)
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Analytics
      - ANALYTICS_IP_SALT=${ANALYTICS_IP_SALT:-change-this-analytics-salt}
      - ANALYTICS_RETENTION_DAYS=${ANALYTICS_RETENTION_DAYS:-30}
      # MaxMind GeoLite2 — optional, omit to disable enrichment.
      - ANALYTICS_GEOIP_DB_PATH=${ANALYTICS_GEOIP_DB_PATH:-}
      - ANALYTICS_ASN_DB_PATH=${ANALYTICS_ASN_DB_PATH:-}
      # Sentry (optional)
      - NUXT_PUBLIC_SENTRY_DSN=${NUXT_PUBLIC_SENTRY_DSN:-}
    volumes:
      # Mount ./data read-only so MaxMind GeoLite2 mmdb files placed there
      # are visible inside the container at /app/data. Files are not
      # committed; populate ./data manually with GeoLite2-Country.mmdb /
      # GeoLite2-ASN.mmdb downloaded from https://www.maxmind.com/.
      - ./data:/app/data:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gas-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================
  # MySQL Database
  # ===========================================
  mysql:
    image: mysql:8.0
    container_name: gas-mysql
    restart: unless-stopped
    ports:
      # Bound to loopback so the database is not reachable from the host network.
      - "127.0.0.1:3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=${DB_NAME:-ghana_audit_service}
      - MYSQL_USER=${DB_USER:-gas_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-gas_password}
    volumes:
      - mysql-data:/var/lib/mysql
      # - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - gas-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-root_password}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

  # ===========================================
  # Redis (rate limiter + analytics hot counters)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: gas-redis
    restart: unless-stopped
    ports:
      # Bound to loopback so Redis is not reachable from the host network.
      - "127.0.0.1:6479:6379"
    volumes:
      - redis-data:/data
    networks:
      - gas-network
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ===========================================
# Volumes
# ===========================================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

# ===========================================
# Networks
# ===========================================
networks:
  gas-network:
    driver: bridge
