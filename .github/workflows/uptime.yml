# External uptime monitoring for both deployments. See MONITORING.md for the
# full runbook (alert channels, secrets, and how this relates to in-cluster
# k8s probes).
#
# How it works:
#   * Every 5 minutes (best-effort — GitHub may delay scheduled runs under
#     load), each environment is probed: the homepage is the up/down signal,
#     and /api/health is a deeper database check where deployed (a 404 means
#     the endpoint isn't on that environment yet and is skipped).
#   * Alerting is edge-triggered via a GitHub incident issue per environment
#     (label `uptime:<env>`): the first failed check opens the issue, the
#     first successful check after an outage comments and closes it. Repo
#     watchers get notified externally (email/mobile) through normal GitHub
#     issue notifications — zero extra configuration.
#   * Optionally, the same down/recovered transitions post to Slack and/or
#     send email directly, when the UPTIME_* secrets are configured.
#   * Every probe result is appended to the `uptime-history` branch by the
#     record job, which regenerates a status page (README.md), status.json,
#     and Shields badge JSON there — uptime % over 24h/7d/30d/90d, latency,
#     and an incident log. See scripts/uptime/update-history.py.
#
# NOTE: scheduled workflows only run from the default branch, so monitoring
# activates once this file lands on main.

name: Uptime Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  check:
    name: Check ${{ matrix.environment }}
    runs-on: ubuntu-latest
    # Worst healthy case is ~2 min (3 homepage attempts + health check);
    # cap the job so a hung run can't stack the 5-minute schedule for hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: test
            url: https://test.audit.gov.gh
          - environment: production
            url: https://audit.gov.gh
    env:
      SITE_ENV: ${{ matrix.environment }}
      SITE_URL: ${{ matrix.url }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      # Optional alert channels — empty unless the secrets are configured
      # (repo-level secrets, not the `production` environment scope, so the
      # scheduled job can read them). See MONITORING.md.
      SLACK_WEBHOOK_URL: ${{ secrets.UPTIME_SLACK_WEBHOOK_URL }}
      SMTP_HOST: ${{ secrets.UPTIME_SMTP_HOST }}
    steps:
      - name: Probe site
        id: probe
        run: |
          set -uo pipefail

          up=true
          reason=''

          # Homepage is the primary up/down signal: 3 attempts, 15s timeout,
          # 10s between attempts, so a single blip doesn't page anyone.
          home_code=000
          home_time=0
          for attempt in 1 2 3; do
            # NB: don't `|| echo` a fallback here — curl's -w prints 000 itself
            # on connection failure, and a fallback echo would double it up.
            out=$(curl -sS -o /dev/null -w '%{http_code} %{time_total}' --max-time 15 -L "$SITE_URL/") || out='000 0'
            home_code=${out%% *}
            home_time=${out##* }
            if [ "$home_code" -ge 200 ] && [ "$home_code" -lt 400 ]; then
              break
            fi
            echo "Attempt $attempt: homepage returned HTTP $home_code"
            [ "$attempt" -lt 3 ] && sleep 10
          done
          if [ "$home_code" -lt 200 ] || [ "$home_code" -ge 400 ]; then
            up=false
            reason="Homepage returned HTTP $home_code on 3 consecutive attempts"
          fi

          # Deep check: /api/health verifies the database behind the site.
          # 404 = endpoint not deployed on this environment (e.g. the legacy
          # production site) — fall back to the homepage signal alone.
          # health_status feeds the history record (see scripts/uptime/).
          health_note='skipped (homepage already down)'
          health_status='skipped'
          if [ "$up" = true ]; then
            health_body=$(mktemp)
            health_code=$(curl -sS -o "$health_body" -w '%{http_code}' --max-time 20 "$SITE_URL/api/health") || health_code=000
            if [ "$health_code" = "404" ]; then
              health_note='not deployed (404); homepage check only'
              health_status='not_deployed'
            elif [ "$health_code" = "200" ]; then
              health_note="HTTP 200: $(head -c 300 "$health_body")"
              health_status=$(jq -r '.status // "unknown"' "$health_body" 2>/dev/null || echo unknown)
            else
              up=false
              reason="/api/health returned HTTP $health_code: $(head -c 300 "$health_body" | tr -d '\n')"
              health_note="HTTP $health_code"
              health_status='error'
            fi
          fi

          echo "up=$up" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

          # Probe record for the uptime-history branch (see the record job).
          # Homepage latency only counts a successful final attempt.
          latency_ms=$(awk -v t="$home_time" 'BEGIN { printf "%d", t * 1000 }')
          [ "$up" = true ] || latency_ms=0
          jq -n \
            --arg env "$SITE_ENV" \
            --arg url "$SITE_URL" \
            --arg ts "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --argjson up "$up" \
            --argjson code "$((10#$home_code))" \
            --argjson latency "$latency_ms" \
            --arg health "$health_status" \
            --arg reason "$reason" \
            '{env: $env, url: $url, ts: $ts, up: $up, http_code: $code, latency_ms: $latency, health: $health, reason: $reason}' \
            > "result-${SITE_ENV}.json"

          {
            echo "### ${SITE_ENV} — ${SITE_URL}"
            if [ "$up" = true ]; then
              echo "✅ Up (homepage HTTP $home_code; health: $health_note)"
            else
              echo "🔴 DOWN — $reason"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Hand the probe record to the `record` job. Runs before the
      # mark-failed step so downtime is recorded too.
      - name: Upload result for history
        uses: actions/upload-artifact@v7
        with:
          name: uptime-result-${{ matrix.environment }}
          path: result-${{ matrix.environment }}.json
          retention-days: 3

      - name: Open or close incident issue
        id: incident
        env:
          UP: ${{ steps.probe.outputs.up }}
          REASON: ${{ steps.probe.outputs.reason }}
        run: |
          set -euo pipefail

          label="uptime:${SITE_ENV}"
          gh label create "$label" --repo "$REPO" \
            --color D93F0B \
            --description "Automated uptime incident (${SITE_ENV})" \
            2>/dev/null || true

          issue_number=$(gh issue list --repo "$REPO" --label "$label" --state open \
            --json number --jq '.[0].number // empty')

          transition=none
          issue_url=''
          run_url="https://github.com/${REPO}/actions/runs/${{ github.run_id }}"
          now=$(date -u +'%Y-%m-%d %H:%M UTC')

          if [ "$UP" = "false" ]; then
            if [ -z "$issue_number" ]; then
              body_file=$(mktemp)
              cat > "$body_file" <<EOF
          The uptime monitor could not reach **${SITE_URL}**.

          | | |
          |---|---|
          | Environment | \`${SITE_ENV}\` |
          | Detected | ${now} |
          | Failure | ${REASON} |
          | Monitor run | ${run_url} |

          The monitor keeps checking every ~5 minutes and will close this issue automatically when the site recovers. Checked from GitHub-hosted runners — if the site loads for you, look for a geo/DNS/CDN-level cause.
          EOF
              issue_url=$(gh issue create --repo "$REPO" \
                --title "🔴 Site down (${SITE_ENV}): ${SITE_URL}" \
                --label "$label" \
                --body-file "$body_file")
              transition=down
              echo "Opened incident: $issue_url"
            else
              echo "Incident #$issue_number already open; site still down — not re-alerting."
            fi
          else
            if [ -n "$issue_number" ]; then
              gh issue comment "$issue_number" --repo "$REPO" \
                --body "✅ **Recovered** at ${now} — ${SITE_URL} is responding again. ([monitor run](${run_url}))"
              gh issue close "$issue_number" --repo "$REPO" --reason completed
              issue_url=$(gh issue view "$issue_number" --repo "$REPO" --json url --jq .url)
              transition=recovered
              echo "Closed incident #$issue_number"
            fi
          fi

          echo "transition=$transition" >> "$GITHUB_OUTPUT"
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"

      - name: Slack alert
        if: env.SLACK_WEBHOOK_URL != '' && steps.incident.outputs.transition != 'none'
        env:
          TRANSITION: ${{ steps.incident.outputs.transition }}
          REASON: ${{ steps.probe.outputs.reason }}
          ISSUE_URL: ${{ steps.incident.outputs.issue_url }}
        run: |
          set -euo pipefail
          if [ "$TRANSITION" = "down" ]; then
            text="🔴 *${SITE_ENV} site DOWN*: ${SITE_URL} — ${REASON}. Incident: ${ISSUE_URL}"
          else
            text="✅ *${SITE_ENV} site recovered*: ${SITE_URL} (${ISSUE_URL})"
          fi
          jq -n --arg text "$text" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"

      - name: Email alert
        if: env.SMTP_HOST != '' && steps.incident.outputs.transition != 'none'
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: ${{ secrets.UPTIME_SMTP_HOST }}
          server_port: ${{ secrets.UPTIME_SMTP_PORT }}
          username: ${{ secrets.UPTIME_SMTP_USER }}
          password: ${{ secrets.UPTIME_SMTP_PASS }}
          from: ${{ secrets.UPTIME_SMTP_FROM }}
          to: ${{ secrets.UPTIME_ALERT_TO }}
          subject: >-
            ${{ steps.incident.outputs.transition == 'down'
                && format('🔴 Site down ({0}): {1}', matrix.environment, matrix.url)
                || format('✅ Site recovered ({0}): {1}', matrix.environment, matrix.url) }}
          body: |
            Environment: ${{ matrix.environment }}
            URL: ${{ matrix.url }}
            Status: ${{ steps.incident.outputs.transition }}
            Details: ${{ steps.probe.outputs.reason || 'site is responding again' }}
            Incident issue: ${{ steps.incident.outputs.issue_url }}

      - name: Mark run failed while site is down
        if: steps.probe.outputs.up == 'false'
        env:
          REASON: ${{ steps.probe.outputs.reason }}
        run: |
          echo "::error::${SITE_ENV} site is down — ${REASON}"
          exit 1

  # Persist every probe result on the `uptime-history` branch and regenerate
  # the status page there (uptime % over 24h/7d/30d/90d, latency, incident
  # log). Runs after both environment checks — `if: always()` because down
  # checks fail their job and MUST still be recorded. Push races between
  # scheduled runs are prevented by the workflow-level concurrency group.
  record:
    name: Record uptime history
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download probe results
        uses: actions/download-artifact@v8
        with:
          pattern: uptime-result-*
          merge-multiple: true
          path: results

      - name: Append history and regenerate status page
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Bootstrap the history branch from an empty tree on first run, so
          # it shares no history with main and carries only uptime data.
          if ! git fetch origin uptime-history 2>/dev/null; then
            init_commit=$(git commit-tree "$(git hash-object -t tree /dev/null)" \
              -m "chore: initialise uptime history branch")
            git push origin "$init_commit:refs/heads/uptime-history"
            git fetch origin uptime-history
          fi

          history_dir="$RUNNER_TEMP/uptime-history"
          git worktree add --detach "$history_dir" origin/uptime-history

          python3 scripts/uptime/update-history.py results "$history_dir"

          cd "$history_dir"
          git add -A
          if git diff --cached --quiet; then
            echo "No new results to record."
            exit 0
          fi
          git commit -m "uptime: record $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push origin HEAD:uptime-history

      - name: Add status to run summary
        run: |
          status="$RUNNER_TEMP/uptime-history/status.json"
          if [ -f "$status" ]; then
            {
              echo '### Uptime (rolling)'
              jq -r '
                .environments | to_entries[] |
                "- **\(.key)**: \(if .value.current_up then "🟢 up" else "🔴 down" end)" +
                " — 24h \(.value.windows["24h"].uptime_pct // "–")%," +
                " 7d \(.value.windows["7d"].uptime_pct // "–")%," +
                " 30d \(.value.windows["30d"].uptime_pct // "–")%," +
                " 90d \(.value.windows["90d"].uptime_pct // "–")%"
              ' "$status"
              echo
              echo 'Full history: [`uptime-history` branch](https://github.com/${{ github.repository }}/blob/uptime-history/README.md)'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
