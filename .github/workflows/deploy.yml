name: Deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-and-deploy-staging
  cancel-in-progress: false

env:
  ACR_NAME: regisry
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    name: Quality Gate
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Images
    needs: ci
    runs-on: ubuntu-latest
    # staging environment holds the Azure auth secrets used to push to ACR.
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build frontend image
        run: |
          docker build \
            --target runner \
            --build-arg NUXT_PUBLIC_SITE_URL=https://audit.gov.gh \
            -t ${{ env.ACR_NAME }}.azurecr.io/gas-frontend:${{ env.IMAGE_TAG }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/gas-frontend:latest \
            ./ghana-audit-service

      # Scan the built frontend image before it is pushed (M-5). The report shows
      # High+Critical; the gate fails the deploy only on (fixable) Critical findings.
      - name: Scan frontend image (report — non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ACR_NAME }}.azurecr.io/gas-frontend:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan frontend image (fail on critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ACR_NAME }}.azurecr.io/gas-frontend:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Build and push migrate image
        run: |
          docker build \
            --target migrator \
            -t ${{ env.ACR_NAME }}.azurecr.io/gas-migrate:${{ env.IMAGE_TAG }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/gas-migrate:latest \
            ./ghana-audit-service

      - name: Push images
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/gas-frontend:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/gas-frontend:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/gas-migrate:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/gas-migrate:latest

  deploy-staging:
    name: Deploy
    needs: build-and-push
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-k8s.yml
    with:
      environment: staging
      overlay: staging
      image_tag: ${{ github.sha }}
    secrets: inherit
