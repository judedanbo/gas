name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ghana-audit-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ghana-audit-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Dependency vulnerability scan (M-5). The full report is informational; the
      # build only fails on Critical advisories. Known Highs are mostly build-time /
      # transitive and tracked for the deferred @nuxtjs/i18n major upgrade.
      - name: Dependency audit (report — non-blocking)
        run: npm audit || true

      - name: Dependency audit (fail on critical)
        run: npm audit --audit-level=critical

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
